[build-system]
build-backend = "hatchling.build"
requires = [
  "hatch-fancy-pypi-readme>=25.1",
  "hatch-vcs>=0.5",
  "hatchling>=1.29",
]

[project]
name = "filelock"
import-names = [ "filelock" ]
description = "A platform independent file lock."
keywords = [
  "file",
  "lock",
  "synchronization",
]
license = "MIT"
maintainers = [
  { name = "Bernát Gábor", email = "gaborjbernat@gmail.com" },
]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Libraries",
  "Topic :: System",
]
dynamic = [
  "readme",
  "version",
]
urls.Changelog = "https://py-filelock.readthedocs.io/en/latest/changelog.html"
urls.Documentation = "https://py-filelock.readthedocs.io"
urls.Homepage = "https://github.com/tox-dev/filelock"
urls.Source = "https://github.com/tox-dev/filelock"
urls.Tracker = "https://github.com/tox-dev/filelock/issues"

[dependency-groups]
dev = [
  { include-group = "coverage" },
  { include-group = "docs" },
  { include-group = "fix" },
  { include-group = "pkg-meta" },
  { include-group = "test" },
  { include-group = "type" },
]
test = [
  "covdefaults>=2.3",
  "diff-cover>=10.2",
  "pytest>=9.0.3",
  "pytest-asyncio>=1.3",
  "pytest-cov>=7.1",
  "pytest-mock>=3.15.1",
  "pytest-randomly>=3.16",
  "pytest-timeout>=2.4",
  "virtualenv>=21.2",
]
type = [
  "ty>=0.0.30",
  { include-group = "docs" },
  { include-group = "test" },
]
docs = [
  "furo>=2025.12.19",
  "sphinx>=9.1",
  "sphinx-autodoc-typehints>=3.9.11",
  "sphinx-copybutton>=0.5.2",
  "sphinx-design>=0.7",
  "sphinx-llm>=0.4.1,!=1.1",
  "sphinx-sitemap>=2.9",
  "sphinxcontrib-mermaid>=2.0.1",
  "sphinxcontrib-towncrier>=0.5.0a0",
  "sphinxext-opengraph>=0.13",
  "towncrier>=24.8",
]
coverage = [
  "covdefaults>=2.3",
  "coverage[toml]>=7.13.5",
  "diff-cover>=10.2",
]
fix = [
  "pre-commit-uv>=4.2.1",
]
lock-tools = [ "nab==0.0.22" ]
pkg-meta = [
  "check-wheel-contents>=0.6.3",
  "twine>=6.2",
  "uv>=0.11.5",
]
release = [
  "prek>=0.5",
  "release-creator>=0.6.5",
  "towncrier>=26.9",
]
release-check = [
  "prek>=0.5",
]
release-news = [
  "release-creator>=0.6.5",
  "towncrier>=26.9",
]
release-notes = [
  "release-creator>=0.6.5",
]
release-prepare = [
  "prek>=0.5",
  "release-creator>=0.6.5",
  "towncrier>=26.9",
]
release-validate = [
  "prek>=0.5",
  "release-creator>=0.6.5",
]

[tool.hatch]
version.source = "vcs"
metadata.hooks.fancy-pypi-readme.content-type = "text/markdown"
metadata.hooks.fancy-pypi-readme.fragments = [ { path = "README.md" } ]
build.hooks.vcs.version-file = "src/filelock/version.py"
build.targets.sdist.include = [
  "/docs",
  "/src",
  "/tasks",
  "/tests",
  "/tox.toml",
]

[tool.uv]
dependency-groups.dev = { requires-python = ">=3.12" }
dependency-groups.docs = { requires-python = ">=3.12" }
dependency-groups.release = { requires-python = ">=3.15" }
dependency-groups.release-check = { requires-python = ">=3.15" }
dependency-groups.release-news = { requires-python = ">=3.15" }
dependency-groups.release-notes = { requires-python = ">=3.15" }
dependency-groups.release-prepare = { requires-python = ">=3.15" }
dependency-groups.release-validate = { requires-python = ">=3.15" }
dependency-groups.type = { requires-python = ">=3.12" }

[tool.ruff]
line-length = 120
format.preview = true
format.docstring-code-line-length = 100
format.docstring-code-format = true
lint.select = [
  "ALL",
]
lint.ignore = [
  "async-function-with-timeout",               # lock acquisition timeouts support polling; cancellation would change the public API
  "CPY",                                       # No copyright statements
  "DOC",                                       # no support yet
  "escape-sequence-in-docstring",              # Use `r"""` if any backslashes in a docstring
  "hardcoded-bind-all-interfaces",             # Possible binding to all interface
  "incorrect-blank-line-before-class",         # `one-blank-line-before-class` (D203) and `no-blank-line-before-class` (D211) are incompatible
  "missing-blank-line-after-summary",          # 1 blank line required between summary line and description
  "missing-trailing-comma",                    # Conflict with formatter
  "multi-line-summary-first-line",             # `multi-line-summary-first-line` (D212) and `multi-line-summary-second-line` (D213) are incompatible
  "non-empty-init-module",                     # `__init__` module should only contain docstrings and re-exports
  "non-imperative-mood",                       # First line of docstring should be in imperative mood
  "single-line-implicit-string-concatenation", # Conflict with formatter
]
lint.per-file-ignores."tasks/**/*.py" = [
  "assert",                               # asserts state the platform a Windows-only script already refuses to run outside of, narrowing it for ty
  "D",                                    # don't care about documentation in tasks scripts
  "implicit-namespace-package",           # no implicit namespace
  "print",                                # print allowed in scripts
  "subprocess-without-shell-equals-true", # `subprocess` call: check for execution of untrusted input
]
lint.per-file-ignores."tests/**/*.py" = [
  "assert",                               # asserts allowed in tests
  "blind-except",                         # blind exception catching acceptable in test helpers
  "D",                                    # don't care about documentation in tests
  "FBT",                                  # don't care about booleans as positional arguments in tests
  "implicit-namespace-package",           # no implicit namespace
  "import-outside-top-level",             # import should be at top-level
  "import-private-name",                  # private name import from external module
  "magic-value-comparison",               # Magic value used in comparison, consider replacing with a constant variable
  "non-lowercase-variable-in-function",   # variable in function should be lowercase
  "private-member-access",                # accessing private members acceptable in tests
  "pytest-fixture-autouse",               # shared setup fixtures are meant to apply to every test
  "subprocess-without-shell-equals-true", # `subprocess` call: check for execution of untrusted input
  "too-many-arguments",                   # too many arguments in function definition
  "too-many-positional-arguments",        # too many positional arguments
  "too-many-statements-in-try-clause",    # try/finally cleanup blocks in tests legitimately hold many statements
]
lint.isort = { known-first-party = [
  "filelock",
], required-imports = [
  "from __future__ import annotations",
] }
lint.preview = true

[tool.codespell]
builtin = "clear,usage,en-GB_to_en-US"
ignore-words-list = "master"
count = true
quiet-level = 3

[tool.pyproject-fmt]
max_supported_python = "3.15"

[tool.ty]
src.exclude = []
# Mirrors pytest's pythonpath so the tests' `coverage_pragmas` import resolves here too.
environment.extra-paths = [
  ".",
  "tasks",
]
environment.python-version = "3.15"

[tool.pytest]
ini_options.testpaths = [
  "tests",
]
# The project root lets the tests import each other as tests.*; tasks holds coverage_pragmas, whose CAPABILITIES probes
# drive both the coverage exclusions and the skipif gates, so a test can never be skipped while coverage still demands
# its lines. coverage imports that plugin by name in the subprocesses it patches, so it stays a top-level module.
ini_options.pythonpath = [
  ".",
  "tasks",
]
ini_options.markers = [
  "requires_hard_links: exercises StrictSoftFileLock, which needs os.link; skipped where it is missing (Termux/Android)",
]
ini_options.filterwarnings = [
  "error",
  # CPython's resource tracker refuses to unregister a semaphore while it is already cleaning up, and warns instead.
  # multiprocessing.Event and Value expose no close, so only the collector frees them, and it picks the moment. Seen
  # on 3.12 alone. Filtering the tracker's own warning keeps the finalizer from raising rather than hiding the raise.
  "ignore:ResourceTracker called reentrantly for resource cleanup:UserWarning",
]
ini_options.verbosity_assertions = 2
ini_options.asyncio_default_fixture_loop_scope = "session"
ini_options.timeout = 20

[tool.coverage]
# The pragma plugin configures the run; measuring it would report the tooling alongside the package under test.
run.omit = [
  "*/tasks/*",
]
run.concurrency = [
  "multiprocessing",
  "thread",
]
run.parallel = true
run.plugins = [
  "covdefaults",
  "coverage_pragmas",
]
run.patch = [
  "_exit",
  "subprocess",
]
run.sigterm = true
paths.other = [
  ".",
  "*/filelock",
  "*\\filelock",
]
paths.source = [
  "src",
  "*/.tox/*/lib/*/site-packages",
  "*/.tox/*/Lib/site-packages",
  "**/src",
  "**\\src",
]
report.fail_under = 100
html.skip_covered = false

[tool.towncrier]
name = "filelock"
directory = "docs/changelog"
filename = "docs/changelog.rst"
template = "release_creator.fragments:template.rst.jinja2"
title_format = false
issue_format = ":pr:`{issue}`"
underlines = [ "*", "=", "-" ]
type = [
  { directory = "feature", name = "Added", showcontent = true },
  { directory = "change", name = "Changes", showcontent = true },
  { directory = "bugfix", name = "Fixed", showcontent = true },
  { directory = "doc", name = "Documentation", showcontent = true },
  { directory = "breaking", name = "Breaking changes", showcontent = true },
  { directory = "security", name = "Security", showcontent = true },
  { directory = "performance", name = "Performance", showcontent = true },
  { directory = "deprecation", name = "Deprecated", showcontent = true },
  { directory = "removal", name = "Removed", showcontent = true },
  { directory = "packaging", name = "Packaging", showcontent = true },
]

[tool.flake8-lazy]
standalone.line-length = 120
standalone.lazy-exclude-modules = [
  # installs the fork-safety audit hook and register_at_fork callbacks at import
  "filelock._api",
  # installs its sqlite audit hook and fork handler at import, and must fail at import without sqlite3 so the package
  # __getattr__ resolves ReadWriteLock and AsyncReadWriteLock to None
  "filelock._read_write",
  # a marker released from a finalizer at interpreter exit unlinks through it, and a first import then fails
  "filelock._windows",
  # registers its atexit cleanup at import
  "filelock._soft_rw._sync",
  # a Python built without it must fail at import, as for filelock._read_write
  "sqlite3",
]

[tool.nab]
mode = "universal"
base-group = "project-runtime"
build-group = "build"
default-groups = []
uploaded-prior-to = "P7D"
decision-order = "stable"
matrix.python = ">=3.15,<3.16"
matrix.platforms = [ "linux_x86_64", "linux_aarch64", "macos_arm64", "windows_amd64" ]
packages.release-creator.uploaded-prior-to = "2026-10-23T19:54:50Z"

[[tool.nab.package-rules]]
match = [ "nab", "nab-index", "nab-markersets", "nab-project", "nab-provider", "nab-resolver" ]
uploaded-prior-to = "2026-10-18T05:45:09Z"
