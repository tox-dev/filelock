name: Upgrade release tools
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 2"
permissions: {}
concurrency:
  group: upgrade-release-tools
  cancel-in-progress: false
jobs:
  upgrade:
    uses: tox-dev/github-workflows/.github/workflows/upgrade-release-tools.yaml@d5089c6f370857700c96a10c2711cee9112f4852
    permissions:
      actions: write
      contents: write
      pull-requests: write
    with:
      groups: release
      python-version: "3.15"
      check-workflow: check.yaml
      commit-message: "build(deps): refresh release lock"
      pull-request-title: "build(deps): refresh release tool lock"
      pull-request-body: |-
        Refresh the locked release tools to the latest versions allowed by the `release` dependency group.
        `pylock.toml` records the exact versions used by release and changelog workflows.
