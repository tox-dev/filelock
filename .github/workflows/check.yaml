name: "🛠️ check"
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags-ignore: ["**"]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 6 * * 1"
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    name: "🧪 Test ${{ matrix.py }} - ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        py:
          - "3.15t"
          - "3.15"
          - "3.14t"
          - "3.14"
          - "3.13"
          - "3.12"
          - "3.11"
          - "pypy3.11"
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-15
        exclude:
          - {os: windows-2025, py: pypy3.11}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: "🔄 Install the latest version of uv"
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
          enable-cache: false
      - name: "🧪 Install tox"
        run: uv tool install --python-preference only-managed --python 3.15 tox --with tox-uv
      - name: "🐍 Install Python"
        run: uv python install --python-preference only-managed ${{ matrix.py }}
      - name: "⚙️ Setup test suite"
        run: tox run -vv --notest --skip-missing-interpreters false -e ${{ matrix.py }}
        env:
          UV_PYTHON_PREFERENCE: only-managed
      # PyPy runs unmeasured: coverage has no JIT path there, so the suite takes 12m rather than 2m and roughly 60 of
      # its lock, heartbeat and poll deadlines lapse under the added latency, though they pass measured in isolation.
      # PyPy is not a coverage source either: the 100% gate stays CPython's.
      - name: "✅ Run test suite"
        run: |
          if [[ "${{ matrix.py }}" == pypy* ]]; then
            tox run --skip-pkg-install -e ${{ matrix.py }} --
          else
            tox run --skip-pkg-install -e ${{ matrix.py }}
          fi
        shell: bash
        env:
          PYTEST_ADDOPTS: "-vv --durations=20"
          UV_PYTHON_PREFERENCE: only-managed
          DIFF_AGAINST: HEAD
      - name: "📝 Rename coverage report file"
        if: ${{ !startsWith(matrix.py, 'pypy') }}
        run: |
          import os; import sys
          os.rename(f".tox/.coverage.${{ matrix.py }}", f".tox/.coverage.${{ matrix.py }}-{sys.platform}")
        shell: python
      - name: "📦 Upload coverage data"
        if: ${{ !startsWith(matrix.py, 'pypy') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          include-hidden-files: true
          name: .coverage.${{ matrix.os }}.${{ matrix.py }}
          path: ".tox/.coverage.*"
          retention-days: 3
  graalpy:
    # GraalPy 25.4.4 can freeze every thread at once under the threaded lock tests, so it stays off pull requests and
    # pushes. A weekly run keeps the capability probes the suite gates on honest on a second runtime. It runs on one
    # Linux job because those probes are a per-OS answer, and unmeasured, so the 100% gate stays CPython's.
    name: "🧪 Test graalpy3.13 - ubuntu-24.04 (weekly)"
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 6 * * 1'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: "🔄 Install the latest version of uv"
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
          enable-cache: false
      - name: "🧪 Install tox"
        run: uv tool install --python-preference only-managed --python 3.15 tox --with tox-uv
      - name: "🐍 Install Python"
        run: uv python install --python-preference only-managed graalpy3.13
      - name: "⚙️ Setup test suite"
        run: tox run -vv --notest --skip-missing-interpreters false -e graalpy3.13
        env:
          UV_PYTHON_PREFERENCE: only-managed
      - name: "✅ Run test suite"
        run: tox run --skip-pkg-install -e graalpy3.13 --
        env:
          PYTEST_ADDOPTS: "-vv --durations=20"
          UV_PYTHON_PREFERENCE: only-managed
  coverage:
    name: "📊 Combine coverage"
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: "⬇️ Download coverage data"
        id: coverage-data
        background: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: .tox
          pattern: .coverage.*
          merge-multiple: true
      - name: "🔄 Install the latest version of uv"
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
          enable-cache: false
      - name: "🧪 Install tox"
        run: uv tool install --python-preference only-managed --python 3.15 tox --with tox-uv
      - name: "📦 Build package to generate version"
        run: uv build --python 3.15 --python-preference only-managed --wheel . --out-dir dist
      - name: "⚙️ Setup coverage tool"
        run: tox -e coverage --notest
        env:
          UV_PYTHON_PREFERENCE: only-managed
      - wait: coverage-data
      - name: "📊 Combine and report coverage"
        run: tox -e coverage --skip-pkg-install
        env:
          UV_PYTHON_PREFERENCE: only-managed
      - name: "📤 Upload HTML report"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: html-report
          path: .tox/htmlcov
  check:
    name: "🔎 ${{ matrix.tox_env }} - ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
        tox_env:
          - dev
          - type
          - docs
          - pkg_meta
        exclude:
          - {os: windows-2025, tox_env: pkg_meta}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: "🔄 Install the latest version of uv"
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
          enable-cache: false
      - name: "🧪 Install tox"
        run: uv tool install --python-preference only-managed --python 3.15 tox --with tox-uv
      - name: "⚙️ Setup test suite"
        run: tox run -vv --notest --skip-missing-interpreters false -e ${{ matrix.tox_env }}
        env:
          UV_PYTHON_PREFERENCE: only-managed
      - name: "✅ Run test suite"
        run: tox run --skip-pkg-install -e ${{ matrix.tox_env }}
        env:
          UV_PYTHON_PREFERENCE: only-managed
  nfs:
    name: "🗄️ NFS mutual exclusion"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "🔄 Install the latest version of uv"
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
          enable-cache: false
      - name: "🗄️ Export and mount loopback NFS shares"
        run: |
          sudo apt-get update
          sudo apt-get install -y nfs-kernel-server nfs-common
          sudo mkdir -p /export/filelock
          sudo chmod 1777 /export/filelock
          echo "/export/filelock 127.0.0.1(rw,sync,no_subtree_check,no_root_squash,insecure)" | sudo tee /etc/exports
          sudo exportfs -ra
          sudo systemctl restart nfs-server
          # NFSv3 sends flock to the server through the NLM lock manager. rpcbind must be enabled; rpc-statd is a
          # static unit that enable cannot touch, so start it explicitly or a v3 flock blocks in the kernel forever.
          sudo systemctl enable --now rpcbind
          sudo systemctl start rpc-statd
          # A client can otherwise reopen a removed claim from its cache and block until the acquire timeout.
          # Disable attribute and lookup caching, and use nosharecache to test independent client caches.
          for m in nfs4a nfs4b nfs3a nfs3b; do sudo mkdir -p "/mnt/$m"; done
          sudo mount -t nfs -o vers=4.2,noac,lookupcache=none 127.0.0.1:/export/filelock /mnt/nfs4a
          sudo mount -t nfs -o vers=4.2,nosharecache,noac,lookupcache=none 127.0.0.1:/export/filelock /mnt/nfs4b
          sudo mount -t nfs -o vers=3,noac,lookupcache=none 127.0.0.1:/export/filelock /mnt/nfs3a
          sudo mount -t nfs -o vers=3,nosharecache,noac,lookupcache=none 127.0.0.1:/export/filelock /mnt/nfs3b
          for m in nfs4a nfs4b nfs3a nfs3b; do sudo chmod 1777 "/mnt/$m"; done
          mount | grep /mnt/nfs
      - name: "🔒 Verify NFSv4 mutual exclusion across two client caches"
        env:
          # StrictSoftFileLock is the lock the gate enforces on NFS: its claim queue hands off fairly, so it finishes
          # every hold with no overlap on both versions (the strict claim retries the transient ESTALE that NFSv3's
          # churn raises). The other two print their behavior ungated and neither is safe to gate on here: native flock
          # does not exclude across NFS client caches (overlaps appear), and the poll-based soft lock starves out under
          # NFS latency before finishing its holds. Prefer StrictSoftFileLock on NFS.
          FILELOCK_VERIFY_LOCKS: StrictSoftFileLock
        run: |
          uv venv
          uv pip install .
          if ! timeout 420 .venv/bin/python tasks/verify_filesystem.py /mnt/nfs4a /mnt/nfs4b; then
            for root in /export/filelock /mnt/nfs4a /mnt/nfs4b; do
              echo "$root claims:"
              find "$root/StrictSoftFileLock.lock.filelock/claims" -maxdepth 1 -type f -printf '%f\n'
            done
            exit 1
          fi
      - name: "🔒 Verify NFSv3 mutual exclusion across two client caches"
        env:
          FILELOCK_VERIFY_LOCKS: StrictSoftFileLock
        run: timeout 420 .venv/bin/python tasks/verify_filesystem.py /mnt/nfs3a /mnt/nfs3b
  smb:
    name: "🗄️ SMB mutual exclusion"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "🔄 Install the latest version of uv"
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
          enable-cache: false
      - name: "🗄️ Export and mount a loopback SMB share"
        run: |
          sudo apt-get update
          sudo apt-get install -y samba cifs-utils
          sudo mkdir -p /srv/filelock
          sudo chmod 1777 /srv/filelock
          sudo tee -a /etc/samba/smb.conf >/dev/null <<'CONF'
          [filelock]
             path = /srv/filelock
             writable = yes
             guest ok = yes
             create mask = 0666
             directory mask = 0777
          CONF
          sudo sed -i '/\[global\]/a \   map to guest = Bad User\n   server min protocol = SMB2' /etc/samba/smb.conf
          sudo systemctl restart smbd
          # Two mounts are two independent CIFS client caches over one server, for a multi-client check.
          sudo mkdir -p /mnt/smba /mnt/smbb
          for m in smba smbb; do
            sudo mount -t cifs //127.0.0.1/filelock "/mnt/$m" \
              -o "guest,uid=$(id -u),gid=$(id -g),file_mode=0777,dir_mode=0777,vers=3.0"
          done
          mount | grep /mnt/smb
      - name: "🔒 Verify SMB mutual exclusion across two client caches"
        # CIFS byte-range locks are mandatory and server-enforced, so FileLock excludes and finishes every hold: it is
        # the lock the gate enforces here. SoftFileLock prints ungated (it excludes but its poll-acquire can starve
        # under contention), and the strict claim needs an atomic no-replace hard link SMB does not reliably provide.
        env:
          FILELOCK_VERIFY_LOCKS: FileLock
        run: |
          uv venv
          uv pip install .
          timeout 240 .venv/bin/python tasks/verify_filesystem.py /mnt/smba /mnt/smbb
  capability:
    name: "🧩 without ${{ matrix.block }}"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        block:
          - fcntl
          - sqlite3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "🔄 Install the latest version of uv"
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
          enable-cache: false
      - name: "🧩 Verify the fallback without ${{ matrix.block }}"
        env:
          FILELOCK_BLOCK_MODULE: ${{ matrix.block }}
        run: |
          uv venv
          uv pip install .
          export PYTHONPATH="$PWD/tasks/capability"
          .venv/bin/python tasks/capability/assert_fallback.py
          .venv/bin/python tasks/verify_filesystem.py
  symlink:
    name: "🔗 Windows symlinks ${{ matrix.developer_mode == '1' && 'granted' || 'denied' }}"
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        developer_mode: ["0", "1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "🔄 Install the latest version of uv"
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
          enable-cache: false
      - name: "🧪 Install tox"
        run: uv tool install --python-preference only-managed --python 3.15 tox --with tox-uv
      # Windows grants symlink creation two ways, so both have to be closed to deny it: Developer Mode lets an
      # unprivileged process create them, and SeCreateSymbolicLinkPrivilege lets any holder create them regardless.
      # Clearing only the registry value left the runner's privilege intact and both variants probed identical.
      - name: "🔗 Set Developer Mode to ${{ matrix.developer_mode }}"
        run: >
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v AllowDevelopmentWithoutDevLicense /d ${{ matrix.developer_mode }}

      - name: "⚙️ Setup test suite"
        run: tox run -vv --notest --skip-missing-interpreters false -e 3.15
      - name: "🔎 Report the probed capability"
        if: matrix.developer_mode == '1'
        run: |
          $env:PYTHONPATH = "$PWD\tasks"
          uv run --no-project --python 3.15 --with coverage python -c "import coverage_pragmas; print(coverage_pragmas.CAPABILITIES)"
      - name: "✅ Run test suite with symlinks granted"
        if: matrix.developer_mode == '1'
        run: tox run --skip-pkg-install -e 3.15 --
      # deny_symlink reports the token privilege, the Developer Mode value, and whether a symlink still succeeds in
      # this process and in a child, so the log says which mechanism actually governs rather than assuming either.
      - name: "🔎 Report the probed capability"
        if: matrix.developer_mode == '0'
        run: |
          $env:PYTHONPATH = "$PWD\tasks"
          uv run --no-project --python 3.15 python tasks\deny_symlink.py uv run --no-project --python 3.15 --with coverage python -c "import coverage_pragmas; print(coverage_pragmas.CAPABILITIES)"
      - name: "✅ Run test suite with symlinks denied"
        if: matrix.developer_mode == '0'
        run: uv run --no-project --python 3.15 python tasks\deny_symlink.py tox run --skip-pkg-install -e 3.15 --
  termux:
    name: "🤖 Termux (Android)"
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: "🧪 Run the suite in a real Termux userland via tox"
        run: docker compose run --rm termux
  changelog:
    name: "📝 News fragment"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
          enable-cache: false
      - name: Install locked release tools
        run: |
          uv venv --python 3.15 "$RUNNER_TEMP/release-tools"
          uv pip sync --preview-features pylock --python "$RUNNER_TEMP/release-tools/bin/python" --group release pylock.toml
          echo "$RUNNER_TEMP/release-tools/bin" >> "$GITHUB_PATH"
      - name: Require or validate a changelog fragment
        env:
          SKIP_NEWS: ${{ contains(github.event.pull_request.labels.*.name, 'skip news') }}
          BOT_AUTHOR: ${{ github.event.pull_request.user.type == 'Bot' }}
        run: |
          set -euo pipefail
          fragments=0
          while IFS= read -r path; do
            name=${path##*/}
            case "$name" in
              +*.*.rst|[0-9]*.*.rst) ;;
              *) continue ;;
            esac
            category=${name%.rst}
            category=${category##*.}
            case "$category" in
              feature|change|bugfix|doc|breaking|security|performance|deprecation|removal|packaging) ;;
              *) echo "::error::unknown changelog category in $path"; exit 1 ;;
            esac
            if [[ -z $(tr -d '[:space:]' < "$path") ]]; then
              echo "::error::empty changelog fragment: $path"
              exit 1
            fi
            fragments=$((fragments + 1))
          done < <(git diff --diff-filter=AM --name-only "origin/${GITHUB_BASE_REF}...HEAD" -- 'docs/changelog/*.rst')
          if ((fragments)); then
            towncrier check --compare-with "origin/${GITHUB_BASE_REF}"
          elif [[ "$SKIP_NEWS" != true && "$BOT_AUTHOR" != true ]]; then
            echo '::error::add a changelog fragment or apply the skip news label'
            exit 1
          fi
  release-dry-run:
    name: Release without publishing
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
          enable-cache: false
      - name: Install locked release tools
        run: |
          set -euo pipefail
          uv venv --python 3.15 "$RUNNER_TEMP/release-tools"
          uv pip sync \
            --preview-features pylock \
            --python "$RUNNER_TEMP/release-tools/bin/python" \
            --group release \
            pylock.toml
          echo "$RUNNER_TEMP/release-tools/bin" >> "$GITHUB_PATH"
      - name: Check historical multiple-author notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/tox-dev/filelock/pulls/213 --jq .user.login)" = jahrules
          for author in jahrules gaborbernat; do
            test "$(gh api "users/$author" --jq .type)" = User
          done
          release-creator notes \
            --changelog docs/changelog.rst \
            --tag 3.10.6 \
            --repository tox-dev/filelock \
            --previous 3.10.5 \
            --issue-role pull > "$RUNNER_TEMP/multiple-author-notes.md"
          grep -Fq '[#213](https://github.com/tox-dev/filelock/pull/213) by @jahrules and @gaborbernat.' \
            "$RUNNER_TEMP/multiple-author-notes.md"
          test "$(grep -oF 'https://github.com/tox-dev/filelock/pull/213' \
            "$RUNNER_TEMP/multiple-author-notes.md" | wc -l)" -eq 1
      - id: fixture
        name: Create a local release candidate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base_sha=${BASE_SHA:-$(git rev-parse origin/main)}
          head_sha=${HEAD_SHA:-$GITHUB_SHA}
          pr_number=$PR_NUMBER
          if [[ -z "$pr_number" ]]; then
            pr_number=$(gh pr list --head "$GITHUB_REF_NAME" --base main --state open --json number --jq '.[0].number')
            if [[ -z "$pr_number" ]]; then
              echo "::error::no open pull request for $GITHUB_REF_NAME"
              exit 1
            fi
          fi
          git checkout -B release-validation "$base_sha"
          git merge --squash "$head_sha"
          mkdir -p docs/changelog
          printf 'Verify a user-visible release fix for :issue:`31`.\n' > "docs/changelog/+validation-${pr_number}.bugfix.rst"
          git add -A
          git -c user.name=release-validation -c user.email=release-validation@users.noreply.github.com commit -m "Validate release pipeline (#${pr_number})"
          git init --bare "$RUNNER_TEMP/rehearsal.git"
          git remote add rehearsal "$RUNNER_TEMP/rehearsal.git"
          git push rehearsal HEAD:main
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "pr=$pr_number"
            gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number" \
              --jq '"author=\(.user.login)\nauthor_type=\(.user.type)"'
          } >> "$GITHUB_OUTPUT"
      - id: prepare
        uses: tox-dev/github-workflows/prepare-towncrier@662d014f87340ee1cb9d55ba27421abd35a34524
        with:
          changelog: docs/changelog.rst
          fragments: docs/changelog
          format: none
          patch: ${{ runner.temp }}/release.patch
      - name: Restore release candidate
        run: git reset --hard HEAD
      - uses: tox-dev/github-workflows/validate-release-patch@662d014f87340ee1cb9d55ba27421abd35a34524
        with:
          version: ${{ steps.prepare.outputs.version }}
          patch: ${{ runner.temp }}/release.patch
          changelog: docs/changelog.rst
          fragments: docs/changelog
          remote: rehearsal
          expected-sha: ${{ steps.fixture.outputs.sha }}
          heading-prefix: ""
      - name: Commit and tag the local candidate
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          git -c user.name=release-validation -c user.email=release-validation@users.noreply.github.com commit -m "release $VERSION"
          git tag "$VERSION"
      - uses: tox-dev/github-workflows/build-python-distribution@662d014f87340ee1cb9d55ba27421abd35a34524
        with:
          out-dir: ${{ runner.temp }}/dist
      - name: Prepare generated notes fixture
        env:
          PR_NUMBER: ${{ steps.fixture.outputs.pr }}
          PR_AUTHOR: ${{ steps.fixture.outputs.author }}
        run: |
          printf '* Validate release pipeline by @%s in https://github.com/%s/pull/%s\n' \
            "$PR_AUTHOR" "$GITHUB_REPOSITORY" "$PR_NUMBER" >"$RUNNER_TEMP/generated-notes.md"
      - uses: tox-dev/github-workflows/render-release-notes@662d014f87340ee1cb9d55ba27421abd35a34524
        with:
          tag: ${{ steps.prepare.outputs.version }}
          changelog: docs/changelog.rst
          repository: ${{ github.repository }}
          issue-role: issue
          artifact-url: https://pypi.org/project/filelock/${{ steps.prepare.outputs.version }}/
          generated-notes: ${{ runner.temp }}/generated-notes.md
          output: ${{ runner.temp }}/release-notes.md
      - name: Inspect the rendered notes and artifacts
        env:
          PR_NUMBER: ${{ steps.fixture.outputs.pr }}
          PR_AUTHOR: ${{ steps.fixture.outputs.author }}
          PR_AUTHOR_TYPE: ${{ steps.fixture.outputs.author_type }}
        run: |
          set -euo pipefail
          test "$(grep -c '^\*\*Full Changelog\*\*:' "$RUNNER_TEMP/release-notes.md")" -eq 1
          grep -Fq '### Bug fixes' "$RUNNER_TEMP/release-notes.md"
          grep -Fq "[#${PR_NUMBER}](https://github.com/${GITHUB_REPOSITORY}/pull/${PR_NUMBER})" "$RUNNER_TEMP/release-notes.md"
          grep -Fq "[#31](https://github.com/${GITHUB_REPOSITORY}/issues/31)" "$RUNNER_TEMP/release-notes.md"
          if [[ "$PR_AUTHOR_TYPE" == Bot ]]; then
            if grep -Fq "by @${PR_AUTHOR}" "$RUNNER_TEMP/release-notes.md"; then
              echo '::error::bot credit in release notes'
              exit 1
            fi
          else
            grep -Fq "by @${PR_AUTHOR}" "$RUNNER_TEMP/release-notes.md"
          fi
          if grep -Fq '<!-- Release notes generated' "$RUNNER_TEMP/release-notes.md"; then
            echo '::error::generated-notes banner in release notes'
            exit 1
          fi
          sha256sum "$RUNNER_TEMP"/dist/* >"$RUNNER_TEMP/dist.sha256"
          cp docs/changelog.rst "$RUNNER_TEMP/changelog.rst"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run
          path: |
            ${{ runner.temp }}/release.patch
            ${{ runner.temp }}/release-notes.md
            ${{ runner.temp }}/generated-notes.md
            ${{ runner.temp }}/changelog.rst
            ${{ runner.temp }}/dist.sha256
            ${{ runner.temp }}/multiple-author-notes.md
            ${{ runner.temp }}/dist/*
          if-no-files-found: error
  shared-release-dry-run:
    name: Shared release validation
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    uses: tox-dev/github-workflows/.github/workflows/validate-python-release.yaml@be1ec2cc87824c16519329b292d8f1dfdee647f9
    permissions:
      contents: read
      pull-requests: read
    with:
      changelog: docs/changelog.rst
      fragments: docs/changelog
      format: none
      heading-prefix: ""
      artifact-base-url: https://pypi.org/project/filelock/
      artifact-prefix: shared-
  gate:
    name: "✅ Required checks pass"
    if: always()
    needs: [test, graalpy, coverage, check, nfs, smb, capability, symlink, termux, changelog, release-dry-run, shared-release-dry-run]
    runs-on: ubuntu-24.04
    steps:
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          jq -e --arg event "$EVENT_NAME" --arg ref "$REF" '
            all(
              to_entries[];
              .value.result == "success" or
              (.key == "graalpy" and .value.result == "skipped") or
              (.key == "changelog" and .value.result == "skipped" and $event != "pull_request") or
              (.key == "release-dry-run" and .value.result == "skipped" and
                ($event != "pull_request" and ($event != "workflow_dispatch" or $ref == "refs/heads/main"))) or
              (.key == "shared-release-dry-run" and .value.result == "skipped" and
                ($event != "pull_request" and ($event != "workflow_dispatch" or $ref == "refs/heads/main")))
            )
          ' <<< "$NEEDS_JSON"
